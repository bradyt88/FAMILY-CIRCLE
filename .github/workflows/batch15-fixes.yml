name: Batch 1.5 polish

on:
  push:
    branches: [phase-0-foundation]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Add one-off Batch 1.5 polish step')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply Batch 1.5 follow-up fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/App.tsx')
          text = path.read_text()

          old_money = "${lender?.label ?? 'Family member'} owes ${requester.label} · due ${formatShortDate(request.dueDate)}"
          new_money = "${requester.label} owes ${lender?.label ?? 'family member'} · due ${formatShortDate(request.dueDate)}"
          if old_money not in text:
              raise SystemExit('Money repayment text was not found; stopping without changes.')
          text = text.replace(old_money, new_money, 1)

          old_confirm = "<p className=\"fc-muted\">Your current location will be requested once you confirm.</p>"
          new_confirm = "{emergencyPending.message && <p className=\"fc-muted\">{emergencyPending.message}</p>}<p className=\"fc-muted\">Your current location will be requested once you confirm.</p>"
          if old_confirm not in text:
              raise SystemExit('Emergency confirmation text was not found; stopping without changes.')
          text = text.replace(old_confirm, new_confirm, 1)

          old_profile = "<div className=\"fc-read-profile\"><div><strong>My Status</strong><span>{profileTarget.status}</span></div><div><strong>Bio</strong><span>{profileTarget.bio || 'No bio yet.'}</span></div><div><strong>Phone</strong><a href={`tel:${profileTarget.phone}`}>{profileTarget.phone}</a></div><div><strong>Location sharing</strong><span>{locationSharing[profileTarget.id] ? 'On' : 'Off'}</span></div></div>"
          new_profile = "<div className=\"fc-read-profile\"><div><strong>My Status</strong><span>{profileTarget.status}</span></div><div><strong>Bio</strong><span>{profileTarget.bio || 'No bio yet.'}</span></div><div><strong>Phone</strong><a href={`tel:${profileTarget.phone}`}>{profileTarget.phone}</a></div><div><strong>Location sharing</strong><span>{locationSharing[profileTarget.id] ? 'On' : 'Off'}</span></div><div><strong>Social links</strong><span>{socialNames.some((name) => profileTarget.socials[name]) ? socialNames.filter((name) => profileTarget.socials[name]).map((name) => <a key={name} href={profileTarget.socials[name]} target=\"_blank\" rel=\"noreferrer\">{socialIcons[name]} {name}</a>) : 'None added yet.'}</span></div></div>"
          if old_profile not in text:
              raise SystemExit('Read-only profile block was not found; stopping without changes.')
          text = text.replace(old_profile, new_profile, 1)

          path.write_text(text)
          PY

          rm .github/workflows/batch15-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/batch15-fixes.yml
          git commit -m "Finish Batch 1.5 profile and emergency polish"
          git push
