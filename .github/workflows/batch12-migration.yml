name: Apply Batch 1.2

on:
  push:
    branches: [phase-0-foundation]
    paths:
      - .github/workflows/batch12-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.head_commit.message != 'Apply Batch 1.2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase-0-foundation
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/App.tsx'); s=p.read_text()
          def r(a,b):
            global s
            if a not in s: raise SystemExit('Batch 1.2 patch target missing')
            s=s.replace(a,b,1)
          r("import { useState } from 'react'", "import { useState } from 'react'")
          r("import './batch11.css'\n", "import './batch11.css'\nimport './batch12.css'\n")
          r("type ChatMessage = {\n", "type FamilyPhoto = { id:string; src:string; name:string; time:string }\n\ntype ChatMessage = {\n")
          r("  outgoing?: boolean\n}\n\ntype FamilyEvent", "  outgoing?: boolean\n  attachment?: FamilyPhoto\n}\n\ntype FamilyEvent")
          r("  completed: boolean\n}\n\nconst demoMembers", "  completed: boolean\n  completedAt?: number\n}\n\nconst demoMembers")
          r("  const [messages, setMessages] = useState<ChatMessage[]>(initialMessages)\n  const [chatDraft, setChatDraft] = useState('')\n", "  const [messages, setMessages] = useState<ChatMessage[]>(initialMessages)\n  const [photos, setPhotos] = useState<FamilyPhoto[]>([])\n  const [pendingPhoto, setPendingPhoto] = useState<{src:string; name:string}|null>(null)\n  const [chatDraft, setChatDraft] = useState('')\n")
          r("  function goToTab(tab: HomeTab) {\n    if (tab === 'photos' || tab === 'more') return\n", "  function goToTab(tab: HomeTab) {\n    if (tab === 'more') return\n")
          old="""  function sendMessage() {\n    const text = chatDraft.trim()\n    if (!text) return\n\n    const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })\n    const newMessage: ChatMessage = {\n      initials: selectedMember.initials,\n      time: now,\n      name: selectedMember.label,\n      text,\n      accent: selectedMember.accent,\n      outgoing: true,\n    }\n    setMessages((current) => [newMessage, ...current])\n    setChatDraft('')\n  }\n"""
          new="""  function stagePhoto(file: File) {\n    if (!file.type.startsWith('image/')) return\n    setPendingPhoto((current) => { if (current) URL.revokeObjectURL(current.src); return {src:URL.createObjectURL(file), name:file.name} })\n  }\n\n  function clearPendingPhoto() {\n    setPendingPhoto((current) => { if (current) URL.revokeObjectURL(current.src); return null })\n  }\n\n  function sendMessage() {\n    const text = chatDraft.trim()\n    if (!text && !pendingPhoto) return\n    const now = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })\n    const photo = pendingPhoto ? {id:`photo-${Date.now()}`, src:pendingPhoto.src, name:pendingPhoto.name, time:now} : undefined\n    const newMessage: ChatMessage = { initials:selectedMember.initials, time:now, name:selectedMember.label, text:text || 'Shared a photo', accent:selectedMember.accent, outgoing:true, attachment:photo }\n    if (photo) setPhotos((current) => [photo, ...current])\n    setMessages((current) => [newMessage, ...current])\n    setChatDraft(''); setPendingPhoto(null)\n  }\n"""
          r(old,new)
          r("  function toggleTask(taskId: string) {\n    setTasks((current) => current.map((task) => task.id === taskId ? { ...task, completed: !task.completed } : task))\n  }\n", """  function toggleTask(taskId: string) {\n    const completionTime = Date.now()\n    setTasks((current) => current.map((task) => task.id === taskId ? { ...task, completed: !task.completed, completedAt: !task.completed ? completionTime : undefined } : task))\n    window.setTimeout(() => setTasks((current) => current.filter((task) => task.id !== taskId || task.completedAt !== completionTime)), 86400000)\n  }\n\n  function isTaskOverdue(task: FamilyTask) { return !task.completed && task.dueDate < todayKey }\n""")
          r("  const completedTasks = tasks.filter((task) => task.completed).length\n", "  const visibleTasks = tasks.filter((task) => !task.completed || !task.completedAt || Date.now() - task.completedAt < 86400000)\n  const completedTasks = visibleTasks.filter((task) => task.completed).length\n  const latestPhoto = photos[0]\n")
          r("              {tasks.slice(0, 3).map((task) => {", "              {visibleTasks.slice(0, 3).map((task) => {")
          r("                const assignee = getTaskAssignee(task)\n                return (\n                  <button className=\"task-row\"", "                const assignee = getTaskAssignee(task)\n                const overdue = isTaskOverdue(task)\n                return (\n                  <button className={overdue ? 'task-row task-overdue' : 'task-row'}")
          r("                      <small>{formatRelativeDate(task.dueDate)} · {assignee.label}</small>", "                      <small>{formatRelativeDate(task.dueDate)} · {assignee.label}{overdue ? ' · Overdue' : ''}</small>")
          r("              <div className=\"memory-scene\" aria-hidden=\"true\"><span /></div>", "              {latestPhoto ? <div className=\"memory-photo\"><img src={latestPhoto.src} alt={latestPhoto.name || 'Recent family photo'} /></div> : <div className=\"memory-scene\" aria-hidden=\"true\"><span /></div>}")
          r("                <strong>Family memories</strong>\n                <span>Moments that matter ♡</span>", "                <strong>{latestPhoto ? 'Recent family photo' : 'Family memories'}</strong>\n                <span>{latestPhoto ? `Added in Family Chat · ${latestPhoto.time}` : 'Moments that matter ♡'}</span>")
          oldchat="""          <div className=\"chat-list\">\n            {messages.map((message) => (\n              <div className={message.outgoing ? 'chat-row outgoing' : 'chat-row'} key={`${message.time}-${message.name}-${message.text}`}>\n                <span className={`chat-avatar ${message.accent}`}>{message.initials}</span>\n                <div className=\"chat-bubble\">\n                  <div className=\"chat-meta\"><strong>{message.name}</strong><time>{message.time}</time></div>\n                  <p>{message.text}</p>\n                </div>\n              </div>\n            ))}\n          </div>\n          <div className=\"chat-composer\">\n            <input value={chatDraft} onChange={(event) => setChatDraft(event.target.value)} onKeyDown={(event) => { if (event.key === 'Enter') sendMessage() }} placeholder=\"Write a family message…\" aria-label=\"Write a family message\" />\n            <button type=\"button\" onClick={sendMessage}>Send</button>\n          </div>"""
          newchat="""          <div className=\"chat-list\">\n            {messages.map((message) => (\n              <div className={message.outgoing ? 'chat-row outgoing' : 'chat-row'} key={`${message.time}-${message.name}-${message.text}`}>\n                <span className={`chat-avatar ${message.accent}`}>{message.initials}</span>\n                <div className=\"chat-bubble\">\n                  <div className=\"chat-meta\"><strong>{message.name}</strong><time>{message.time}</time></div>\n                  <p>{message.text}</p>\n                  {message.attachment && <img className=\"chat-photo\" src={message.attachment.src} alt={message.attachment.name || 'Family photo'} />}\n                </div>\n              </div>\n            ))}\n          </div>\n          <div className=\"chat-composer\" onPaste={(event) => { const image=Array.from(event.clipboardData.files).find((file)=>file.type.startsWith('image/')); if(image){event.preventDefault();stagePhoto(image)} }}>\n            {pendingPhoto && <div className=\"chat-pending-photo\"><img src={pendingPhoto.src} alt=\"Photo ready to send\"/><button type=\"button\" onClick={clearPendingPhoto} aria-label=\"Remove photo\">×</button></div>}\n            <input id=\"chat-photo-upload\" className=\"visually-hidden-input\" type=\"file\" accept=\"image/*\" onChange={(event)=>{const file=event.target.files?.[0];if(file)stagePhoto(file);event.currentTarget.value=''}}/>\n            <label className=\"chat-attach-button\" htmlFor=\"chat-photo-upload\">＋ Photo</label>\n            <input value={chatDraft} onChange={(event) => setChatDraft(event.target.value)} onKeyDown={(event) => { if (event.key === 'Enter') sendMessage() }} placeholder=\"Write a family message…\" aria-label=\"Write a family message\" />\n            <button type=\"button\" onClick={sendMessage}>Send</button>\n          </div>\n          <p className=\"picker-hint\">Add a photo or paste an image into the chat box.</p>"""
          r(oldchat,newchat)
          photos_view="""  function renderPhotos() {\n    return (<section className=\"feature-view\" aria-label=\"Recent photos\"><FeatureHeader title=\"Recent Photos\" description=\"Photos shared in Family Chat also appear here.\" onHome={() => setActiveTab('home')} /><div className=\"feature-card\"><div className=\"feature-heading-row\"><div><p className=\"feature-kicker\">Family memories</p><h2>Recent Photos</h2></div><span className=\"feature-badge\">{photos.length} shared</span></div>{photos.length===0?<div className=\"photo-empty-state\"><div className=\"photo-empty-icon\">▧</div><div><strong>No recent photos yet.</strong><p className=\"muted\">Send a photo from Family Chat and it will appear here automatically.</p></div><button type=\"button\" className=\"primary-form-button\" onClick={()=>setActiveTab('chat')}>Open Family Chat</button></div>:<div className=\"photo-grid\">{photos.map((photo)=><article className=\"photo-card\" key={photo.id}><img src={photo.src} alt={photo.name||'Family photo'}/><div className=\"photo-card-copy\"><strong>{photo.name||'Family photo'}</strong><span>Shared in Family Chat · {photo.time}</span></div></article>)}</div>}</div>{renderBottomNav()}</section>)\n  }\n\n"""
          r("  function renderCalendar() {\n", photos_view+"  function renderCalendar() {\n")
          r("    const sortedTasks = [...tasks].sort((a, b) => {", "    const sortedTasks = [...visibleTasks].sort((a, b) => {")
          r("      if (a.completed !== b.completed) return a.completed ? 1 : -1", "      if (isTaskOverdue(a) !== isTaskOverdue(b)) return isTaskOverdue(a) ? -1 : 1\n      if (a.completed !== b.completed) return a.completed ? 1 : -1")
          r("{completedTasks}/{tasks.length} done", "{completedTasks}/{visibleTasks.length} done")
          r("{tasks.length - completedTasks} tasks remaining", "{visibleTasks.length - completedTasks} tasks remaining")
          r("<span>Assigned and dated.</span>", "<span>Completed tasks stay visible for 24 hours.</span>")
          r("className={task.completed ? 'task-detail done' : 'task-detail'}", "className={isTaskOverdue(task) ? 'task-detail overdue' : task.completed ? 'task-detail done' : 'task-detail'}")
          r("<small>Due {formatLongDate(task.dueDate)} · {assignee.label}</small>", "<small>Due {formatLongDate(task.dueDate)} · {assignee.label}{isTaskOverdue(task) ? ' · Overdue' : task.completed ? ' · Completed' : ''}</small>")
          r("  function renderActiveHomeTab() {\n    if (activeTab === 'chat') return renderChat()", "  function renderActiveHomeTab() {\n    if (activeTab === 'chat') return renderChat()\n    if (activeTab === 'photos') return renderPhotos()")
          p.write_text(s)
          Path('src/batch12.css').write_text('''.chat-photo{display:block;width:min(100%,360px);max-height:320px;margin-top:8px;border-radius:14px;object-fit:cover;background:#060b18}.chat-composer{flex-wrap:wrap}.chat-attach-button{min-height:44px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(124,92,255,.42);background:rgba(124,92,255,.08);color:#d7ceff;border-radius:14px;padding:10px 12px;font-size:.76rem;font-weight:850}.visually-hidden-input{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.chat-pending-photo{position:relative;width:62px;height:62px;border-radius:14px;overflow:hidden;flex:0 0 auto}.chat-pending-photo img{width:100%;height:100%;object-fit:cover}.chat-pending-photo button{position:absolute;top:3px;right:3px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(0,0,0,.72);color:#fff}.picker-hint{color:#7482a9;font-size:.64rem;line-height:1.45}.task-overdue,.task-detail.overdue{border-color:rgba(255,88,109,.52)!important;background:linear-gradient(145deg,rgba(92,18,36,.34),rgba(30,8,20,.62))!important}.task-overdue strong,.task-overdue small,.task-detail.overdue strong,.task-detail.overdue small{color:#ff9aa8!important}.photo-empty-state{min-height:190px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:18px;border-radius:18px;border:1px dashed rgba(124,92,255,.30);background:rgba(8,12,26,.58)}.photo-empty-icon{width:54px;height:54px;display:grid;place-items:center;border-radius:16px;background:rgba(124,92,255,.12);color:#c1b2ff;font-size:1.5rem}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.photo-card{overflow:hidden;border-radius:18px;border:1px solid rgba(124,92,255,.26);background:rgba(5,10,24,.74)}.photo-card img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover}.photo-card-copy{display:grid;gap:3px;padding:10px 11px 12px}.photo-card-copy strong{font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photo-card-copy span{color:#8390b4;font-size:.64rem}.memory-photo{height:215px;border-radius:17px;overflow:hidden;border:1px solid rgba(124,92,255,.42);background:#080d1d}.memory-photo img{width:100%;height:100%;object-fit:cover;display:block}@media(max-width:760px){.photo-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.photo-empty-state{grid-template-columns:auto 1fr}.photo-empty-state .primary-form-button{grid-column:1/-1;width:100%}}@media(max-width:600px){.chat-attach-button,.chat-composer input,.chat-composer button{width:100%}}''')
          PY
          npm install
          npm run build
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/batch12-migration.yml
          git add -A && git commit -m "Apply Batch 1.2" && git push origin HEAD:phase-0-foundation
