name: CI

on:
  push:
    branches: [main, phase-0-foundation]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Node runtime
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
